<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('techjourney-theme') || 'dark';
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Journey — Explore Technology. Build Skills. Shape Your Journey.</title>
    <meta name="description" content="Tech Journey helps developers explore programming, technology, roadmaps, tutorials, and the latest trends in the software world." />
    <meta name="keywords" content="programming, web development, backend, frontend, AI, machine learning, computer science, networking, tech news, developer roadmaps, interview questions, tutorials" />
    <meta property="og:title" content="Tech Journey — Developer Knowledge Platform" />
    <meta property="og:description" content="Explore Technology. Build Skills. Shape Your Journey. Articles, roadmaps, tutorials, and developer tools." />
    <meta property="og:type" content="website" />
    
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-page text-heading antialiased selection:bg-[#0F6B4F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
