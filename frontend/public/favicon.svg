<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#00DF89" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="favPath" x1="25" y1="75" x2="65" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00DF89" />
      <stop offset="30%" stop-color="#00D492" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Dark Squircle Shield -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#080D1A" stroke="url(#favBorder)" stroke-width="3.5" />

  <!-- Left Code Bracket { -->
  <path d="M 23 33 C 17 33 15 37 15 42 C 15 47 12 48 9.5 50 C 12 52 15 53 15 58 C 15 63 17 67 23 67" stroke="#00E5FF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Code Bracket } -->
  <path d="M 77 33 C 83 33 85 37 85 42 C 85 47 88 48 90.5 50 C 88 52 85 53 85 58 C 85 63 83 67 77 67" stroke="#FBBF24" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- S-Curved Journey Trajectory Ribbon -->
  <path d="M 27 72 C 38 72 50 67 63 58 C 72 50 62 41 46 41 C 28 41 30 25 50 25 L 64 25" stroke="url(#favPath)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Start Waypoint (White Ring) -->
  <circle cx="27" cy="72" r="5" fill="#080D1A" stroke="#FFFFFF" stroke-width="3" />

  <!-- Intermediate Waypoint Node (Amber Circle + Dark Center) -->
  <circle cx="63" cy="58" r="6" fill="#F59E0B" stroke="#FBBF24" stroke-width="0.8" />
  <circle cx="63" cy="58" r="2.2" fill="#080D1A" />

  <!-- Destination Terminal (Upward Arrowhead) -->
  <polygon points="64,12 73,25 55,25" fill="#F59E0B" />
</svg>